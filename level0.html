<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Level 0- Simple 3D Rendering</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #050510;
      color: white;
      font-family: Arial, sans-serif;
    }

    canvas {
      display: block;
    }

    #info {
      position: fixed;
      top: 12px;
      left: 12px;
      padding: 12px 14px;
      background: rgba(0, 0, 0, 0.6);
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <div id="info">
    <b>Projection</b><br>
  </div>

<script>

  //we add shapes (like lines) to this canvas
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");

  //an array of objects
  //    to access the first 'x' coordinate you could type vertices[0].x
  let vertices = [ 
    { x:  1,  y: 1,  z: 1},   // A, idx 0
    { x: -1,  y: 1,  z: 1},   // B, idx 1
    { x:  1,  y: -1, z: 1},   // C, idx 2
    { x: -1,  y: -1, z:  1},  // D, idx 3
    { x:  1,  y: 1,  z: -1},  // E, idx 4
    { x: -1,  y: 1,  z: -1},  // F, idx 5
    { x:  1,  y: -1, z:  -1}, // G, idx 6
    { x: -1,  y: -1, z: -1}   // H, idx 7
  ];

  // an array of the indics for the two vertices in each edge
  let edges = [
    [0, 1], //AB 
    [0, 2], //AC 
    [0, 4], //AE 
    [2, 3], //CD 
    [1, 3], //BD 
    [2, 6], //CG 
    [4, 5], //EF 
    [4, 6], //EG 
    [1, 5], //BF 
    [6, 7], //GH 
    [5, 7], //FH 
    [3, 7], //DH 
  ];


  let camera = {x: 0, y: 0, z: -10};
  // camera.x, camera.y, camera.z


  function draw(){

    //here we set up and clear the canvas, every draw frame
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#050510";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // here we will store u,v coordinates for the vertices, 
    // projected onto our 2d plane
    let projectedVertices = [];

    //- loop through the original vertices (X, Y, Z)
    //- and determine their position in 3D space relative to camera (x, y, z)
    //- then project them onto the 2D plane
    for(let v = 0; v< vertices.length; v++){   //  you could also write it foreach...
       console.log("original position:");  //helpful to print things
       console.log( vertices[v] );

       console.log("camera-relative position");
       let camVert = {}; 

       // to get the camera vertices, we subtract the camera position (0,0,-10) from the vertices array we have above. 
       camVert.x = vertices[v].x - camera.x; //**** TO DO (Answered!)
       camVert.y = vertices[v].y- camera.y; //**** TO DO (Annswered!)
       camVert.z = vertices[v].z - camera.z; //**** TO DO (Answered!)
       console.log( camVert );

       console.log("projected position"); 
       let canvasPos = {};
       // projected position is u=x/z, v=y/z
       canvasPos.u = camVert.x/camVert.z; //**** TO DO  (Answered!)
       canvasPos.v = camVert.y/camVert.z; //**** TO DO (Answered!)
       console.log( canvasPos );

       console.log("scale and center"); 
       canvasPos.u = canvasPos.u * canvas.width + canvas.width/2;
       canvasPos.v = canvasPos.v * canvas.height + canvas.height/2;
       console.log( canvasPos );

       projectedVertices.push(canvasPos);
       console.log("---------------"); 

    }

    //loop through the edges
    //  find the newly computed projected vertices - 2 per edge
    //  draw the line
    for(let e = 0; e < edges.length; e++){
      
      //first vertex
      let e1 = edges[e][0]; //idx
      let u1 = projectedVertices[ e1 ].u; 
      let v1 = canvas.height - projectedVertices[ e1 ].v;  //TO DO- explain why did I do this? 
      // This is done to flip the y-coordinate because the origin is at the top left corner of the canvas while in 3d, it is at the center. This way we can align it in a way that makes sense visually.
      

      //second vertex
      let e2 = edges[e][1]; //idx
      let u2 = projectedVertices[ e2 ].u;
      let v2 = canvas.height - projectedVertices[ e2 ].v;  //TO DO- explain why did I do this?
      // This is done to flip the y-coordinate because the origin is at the top left corner of the canvas while in 3d, it is at the center. This way we can align it in a way that makes sense visually.

      drawLine(u1, v1, u2, v2);
    }



  }


  //This uses a built in 'drawLine' function, provided by the javascript canvas
  function drawLine(x1, y1, x2, y2){
    ctx.lineWidth = 2;
    ctx.strokeStyle = "white";

    //this is how you draw a line on the canvas 
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
  }


  //this is how we detect events- 

  // do nothing for now....
    document.addEventListener("keydown", (event) => {

      event.preventDefault();
       switch (event.key) {
        case "ArrowUp":
          //****TO DO: Change camera z position a go closer
          // So i have to get the camera closer, z would be increased?
          camera.z += 1; //**** TO DO (Answered!)

          console.log("Up arrow pressed");
          draw();
          break;
        case "ArrowDown":
          //****TO DO: Change camera z position go further away
          // z would be decreased
          camera.z -= 1; //**** TO DO (Answered!)
          console.log("Down arrow pressed");
          draw();
          break;
        case "ArrowLeft":
          //****TO DO: Change camera x position move left
          // camera to the left means object to the right, so we need to decrease the x value of the camera
          camera.x -= 1; //**** TO DO (Answered!)
          console.log("Left arrow pressed");
          draw();
          break;
        case "ArrowRight":
          //****TO DO: Change camera x position move right
          // camera to the right means object to the left so x would be increased. 
          camera.x += 1; //**** TO DO (Answered!)
          console.log("Right arrow pressed");
          draw();
          break;
        case "R": // changed keyr to R as it was not working on my keyboard
          //****TO DO: reset camera 
          console.log("Reset");
          // Reset camera position to initial values lol
          camera.x = 0;
          camera.y = 0;
          camera.z = -10;
          draw();
          break;
        default:
          return; 
      
      }
    });

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    draw();
  }


  window.addEventListener("resize", resizeCanvas);
  resizeCanvas();



</script>
</body>
</html>
